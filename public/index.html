<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Beam — local file transfer</title>
<meta name="description" content="Send files directly between devices on the same Wi-Fi. No cloud, no accounts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="noise-overlay" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2 L12 15 M12 2 L6 8 M12 2 L18 8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15 L4 20 L20 20 L20 15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span class="brand-name">Beam</span>
  </div>
  <div class="net-status" id="netStatus">
    <span class="net-dot" id="netDot"></span>
    <span id="netLabel">Connecting…</span>
  </div>
</header>

<main class="stage">

  <section class="identity-row" aria-label="Your device">
    <div class="self-card">
      <span class="self-dot" aria-hidden="true"></span>
      <div class="self-meta">
        <span class="self-label">This device</span>
        <span class="self-name" id="selfName">—</span>
      </div>
      <button class="rename-btn" id="renameBtn" title="Rename this device" aria-label="Rename this device">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 20 L4 16 L15.5 4.5 a2 2 0 0 1 3 3 L6.5 20 Z M13.5 6.5 L17.5 10.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </section>

  <section class="radar-zone" aria-label="Devices on your network">
    <div class="radar" id="radar">
      <div class="radar-ring ring-1"></div>
      <div class="radar-ring ring-2"></div>
      <div class="radar-ring ring-3"></div>
      <div class="radar-sweep" id="radarSweep" aria-hidden="true"></div>
      <div class="radar-center" id="radarCenter">
        <span class="radar-center-dot"></span>
      </div>
      <!-- peer nodes injected here -->
    </div>
    <p class="radar-caption" id="radarCaption">Searching your Wi-Fi network for other devices…</p>
  </section>

  <section class="peers-zone" aria-label="Available devices">
    <div class="peers-head">
      <h2>Nearby devices</h2>
      <span class="peer-count" id="peerCount">0 found</span>
    </div>
    <div class="peers-list" id="peersList">
      <div class="peers-empty" id="peersEmpty">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M12 7 v6 M12 16.5 v.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <p>No devices yet. Open Beam on another device connected to the <strong>same Wi-Fi</strong>.</p>
      </div>
    </div>
  </section>

  <section class="dropzone-zone">
    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Choose files to send">
      <input type="file" id="fileInput" multiple hidden>
      <svg viewBox="0 0 24 24" width="26" height="26" class="dz-icon"><path d="M12 15 V4 M12 4 L7.5 8.5 M12 4 L16.5 8.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15 v3.5 a1.5 1.5 0 0 0 1.5 1.5 h13 a1.5 1.5 0 0 0 1.5 -1.5 V15" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <p class="dz-title">Drop files, or click to choose</p>
      <p class="dz-sub" id="dzSub">Select a device above, then add files to send</p>
    </div>
  </section>

  <section class="transfers-zone" id="transfersZone" hidden>
    <h2>Transfers</h2>
    <div class="transfers-list" id="transfersList"></div>
  </section>

</main>

<!-- Device picker sheet -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <h3 id="sheetTitle">Send to which device?</h3>
    <p class="sheet-sub" id="sheetSub">—</p>
    <div class="sheet-list" id="sheetList"></div>
    <button class="sheet-cancel" id="sheetCancel">Cancel</button>
  </div>
</div>

<!-- Incoming transfer request -->
<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"></script>
<script src="app.js"></script>
</body>
</html>
